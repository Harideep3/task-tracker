<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — a task tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">§</span>
        <h1>Ledger</h1>
      </div>
      <p class="brand-sub">a plain task tracker</p>

      <nav class="filters">
        <p class="nav-label">Show</p>
        <button class="filter-btn active" data-filter="all">All tasks</button>
        <button class="filter-btn" data-filter="active">Open</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </nav>

      <nav class="categories">
        <p class="nav-label">Category</p>
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="Work">Work</button>
        <button class="cat-btn" data-cat="School">School</button>
        <button class="cat-btn" data-cat="Personal">Personal</button>
      </nav>

      <div class="stats">
        <p class="nav-label">This week</p>
        <canvas id="weekChart" width="220" height="120"></canvas>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">

      <header class="topbar">
        <div class="tally">
          <span id="openCount">0</span> open &middot; <span id="doneCount">0</span> done
        </div>
        <div class="today" id="todayDate"></div>
      </header>

      <form class="task-form" id="taskForm">
        <input type="text" id="taskTitle" placeholder="Add a task…" autocomplete="off" required>
        <select id="taskCategory">
          <option value="Work">Work</option>
          <option value="School">School</option>
          <option value="Personal">Personal</option>
        </select>
        <select id="taskPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <input type="date" id="taskDue">
        <button type="submit" class="add-btn">Add</button>
      </form>

      <div class="sort-row">
        <label for="sortBy">Sort by</label>
        <select id="sortBy">
          <option value="created">Date added</option>
          <option value="due">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </div>

      <ul class="task-list" id="taskList">
        <!-- tasks get rendered here by app.js -->
      </ul>

      <p class="empty-state" id="emptyState">Nothing here yet. Add your first task above.</p>

    </main>
  </div>

<script src="app.js"></script>
</body>
</html>
